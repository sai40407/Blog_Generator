[project]
name = "blog-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sai kumar", email = "saikumar40407@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
blog-agentic = "blog_agentic:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
